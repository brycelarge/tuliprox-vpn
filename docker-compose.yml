services:
  tuliprox-vpn:
    image: ghcr.io/brycelarge/tuliprox-vpn:latest
    platform: linux/amd64
    pull_policy: never
    container_name: tuliprox-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "8901:8901"
      - "${HDHOMERUN_PORTS:-5001-5008}:${HDHOMERUN_PORTS:-5001-5008}"   # HDHomeRun devices — set HDHOMERUN_PORTS=5004-5005 to restrict
      - "8118:8118"   # Privoxy (only needed if PRIVOXY_ENABLED=true)
    volumes:
      - ./data/config:/app/config
      - ./data/data:/app/data
      - ./data/backup:/app/backup
      - ./data/downloads:/app/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=UTC

      # ── VPN ──────────────────────────────────────────────────────────────
      - VPN_ENABLED=true
      # Supported: CUSTOM, PIA, SURFSHARK, IPVANISH, NORDVPN, VYPRVPN, PROTONVPN
      - OPENVPN_PROVIDER=${OPENVPN_PROVIDER}
      # Specific config file (optional — omit to use first .ovpn found)
      - OPENVPN_CONFIG=${OPENVPN_CONFIG}
      - OPENVPN_PROTOCOL=udp
      - OPENVPN_USERNAME=${OPENVPN_USERNAME}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      # Extra openvpn CLI flags (optional)
      - OPENVPN_OPTIONS=
      # Set true to force re-download of provider configs on next start
      - OPENVPN_FORCE_UPDATE=false

      # ── DNS / routing ─────────────────────────────────────────────────────
      # Comma-separated DNS servers (optional)
      - NAME_SERVERS=
      # Comma-separated CIDRs to route outside the tunnel (optional)
      - LOCAL_NETWORK=${LOCAL_NETWORK:-}

      # ── Privoxy ───────────────────────────────────────────────────────────
      - PRIVOXY_ENABLED=false
      - PRIVOXY_PORT=8118

      # ── HDHomeRun ─────────────────────────────────────────────────────────
      # Port range for HDHomeRun devices. Must match config.yml hdhomerun.devices[].port values.
      # Also update the ports mapping above to match.
      - HDHOMERUN_PORTS=${HDHOMERUN_PORTS:-5001-5008}

      # ── tuliprox ──────────────────────────────────────────────────────────
      # Extra CLI args passed to the tuliprox binary (optional)
      - TULIPROX_ARGS=

      # ── Debug ─────────────────────────────────────────────────────────────
      - DEBUG=true

    restart: unless-stopped


